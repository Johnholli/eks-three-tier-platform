apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-sec
  namespace: workshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mongo-sec
  data:
    - secretKey: username
      remoteRef:
        key: workshop/mongo
        property: username
    - secretKey: password
      remoteRef:
        key: workshop/mongo
        property: password